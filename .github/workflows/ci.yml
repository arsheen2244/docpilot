name: CI/CD

# test    -> every push and pull request: unit tests, API smoke test, eval gate
# docker  -> every push and pull request: build the image, run it, smoke-test the container
# publish -> push to main or a v* tag: push the image to GitHub Container Registry (ghcr.io)
# deploy  -> push to main, only when the GCP_PROJECT_ID repository variable is set: deploy to Cloud Run
#            (one-time setup in docs/deploy.md; until then this job is skipped, not failed)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Eval gate (dev split, offline stack)
        # Fails the build if answer quality regresses below today's dev-split numbers (0.71 / 1.00).
        run: |
          python scripts/run_agent_eval.py --split dev > /dev/null
          python - <<'EOF'
          import json, sys
          r = json.load(open("results/agent_dev_default.json"))
          checks = {"answer_rate": (r["answer_rate"], 0.65),
                    "correct_abstention_rate": (r["correct_abstention_rate"], 0.75),
                    "cites_gold_given_answered": (r["cites_gold_given_answered"], 0.90)}
          for name, (got, floor) in checks.items():
              print(f"{name}: {got:.3f} (floor {floor})")
          sys.exit(any(got < floor for got, floor in checks.values()))
          EOF
      - name: Smoke test a real uvicorn server
        run: |
          uvicorn docpilot.api:create_app --factory --port 8080 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python scripts/smoke_api.py http://127.0.0.1:8080

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and smoke-test it
        run: |
          docker run -d --name docpilot -p 8080:8080 docpilot:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 1; done
          python3 scripts/smoke_api.py http://127.0.0.1:8080 || (docker logs docpilot; exit 1)

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: docpilot
          region: ${{ vars.GCP_REGION || 'us-central1' }}
          source: ./
          flags: --allow-unauthenticated --max-instances=1
          secrets: |
            DOCPILOT_API_KEYS=docpilot-api-keys:latest
      - name: Smoke-test the deployed service
        run: python3 scripts/smoke_api.py "${{ steps.deploy.outputs.url }}" "${{ secrets.DOCPILOT_API_KEY }}"
